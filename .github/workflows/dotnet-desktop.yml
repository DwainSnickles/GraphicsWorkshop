# GraphicsWorkshop is a .NET Framework 4.8 WinForms application restored through
# packages.config, so it is built with MSBuild from Visual Studio rather than
# `dotnet build`. The Windows runner image ships the .NET Framework 4.8 targeting
# pack, and the DesignSurface and ribbon assemblies it references are vendored in
# lib/, so a clean checkout needs nothing else.

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # A packages.config project is skipped by the restore target unless
      # RestorePackagesConfig is switched on, which is how CButtonLib arrives.
      - name: Restore NuGet packages
        run: msbuild GraphicsWorkshop.sln -t:Restore -p:RestorePackagesConfig=true -p:Configuration=${{ matrix.configuration }} -v:minimal

      - name: Build
        run: msbuild GraphicsWorkshop.sln -p:Configuration=${{ matrix.configuration }} -v:minimal

      # The whole output folder, not just the exe: the app needs the vendored
      # DesignSurface and ribbon DLLs next to it, plus CButtonLib from NuGet.
      - name: Upload the built application
        uses: actions/upload-artifact@v4
        with:
          name: GraphicsWorkshop-${{ matrix.configuration }}
          path: bin/${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 30
